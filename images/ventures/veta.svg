<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="scr"><rect x="11" y="21" width="33" height="30" rx="4"/></clipPath></defs>
  <!-- rabbit-ear antenna -->
  <g stroke="#A491C4" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M26 18 L18 6"/><path d="M38 18 L48 5"/>
  </g>
  <circle cx="18" cy="6" r="2.5" fill="#3DE0E6"/>
  <circle cx="48" cy="5" r="2.5" fill="#FF5C77"/>
  <!-- TV body -->
  <rect x="6" y="16" width="52" height="40" rx="7" fill="#2A1850" stroke="#8A5BFF" stroke-width="1.5"/>
  <!-- screen: color-bar test pattern + scanlines -->
  <g clip-path="url(#scr)">
    <rect x="11" y="21" width="33" height="30" fill="#0E0720"/>
    <rect x="11" y="21" width="8.25" height="30" fill="#FF5C77"/>
    <rect x="19.25" y="21" width="8.25" height="30" fill="#E6B450"/>
    <rect x="27.5" y="21" width="8.25" height="30" fill="#3DE0E6"/>
    <rect x="35.75" y="21" width="8.25" height="30" fill="#8A5BFF"/>
    <g fill="#0E0720" opacity="0.16">
      <rect x="11" y="24" width="33" height="1.4"/><rect x="11" y="29" width="33" height="1.4"/>
      <rect x="11" y="34" width="33" height="1.4"/><rect x="11" y="39" width="33" height="1.4"/>
      <rect x="11" y="44" width="33" height="1.4"/>
    </g>
  </g>
  <rect x="11" y="21" width="33" height="30" rx="4" fill="none" stroke="#150A28" stroke-width="2.5"/>
  <!-- control panel: knobs + speaker -->
  <circle cx="51" cy="27" r="3" fill="#F6EDF7"/>
  <circle cx="51" cy="36" r="3" fill="#E6B450"/>
  <rect x="47.5" y="43" width="7" height="2.2" rx="1.1" fill="#A491C4"/>
  <rect x="47.5" y="46.6" width="7" height="2.2" rx="1.1" fill="#A491C4"/>
  <!-- legs -->
  <rect x="14" y="55.5" width="3" height="4.5" rx="1.5" fill="#8A5BFF"/>
  <rect x="47" y="55.5" width="3" height="4.5" rx="1.5" fill="#8A5BFF"/>
</svg>
